{% extends 'base.html' %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='styles/form-login.css') }}">
<div class="body-login">
<div class="login-card">
  <h3 class="text-center mb-4">Register</h3>
  <form method="post">
    <div class="mb-3">
      <label for="username" class="form-label">Username</label>
      <input class="form-control" id="username" name ="username" placeholder="Enter your username" required>
    </div>
    <div class="mb-3">
      <label for="email" class="form-label">Email address</label>
      <input class="form-control" id="username" name ="email" placeholder="Enter your email" required>
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input type="password" class="form-control" id="password" name = "password" placeholder="Enter your password" required>
    </div>
    <button type="submit" class="btn btn-primary login-button">Register</button>
  </form>
</div>
</div>
{% endblock %}
