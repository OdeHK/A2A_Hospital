{% extends 'base.html' %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='styles/form-login.css') }}">
<div class="body-login">
<div class="login-card">
  <h3 class="text-center mb-4">Login</h3>
  <form method="post">
    <div class="mb-3">
      <label for="username" class="form-label">Username</label>
      <input class="form-control" id="username" name ="username" placeholder="Enter your username" required>
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input type="password" class="form-control" id="password" name = "password" placeholder="Enter your password" required>
    </div>
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="remember">
        <label class="form-check-label" for="remember">Remember me</label>
      </div>
      <a href="/auth/register" class="text-decoration-none">Forgot password?</a>
    </div>
    <button type="submit" class="btn btn-primary login-button">Login</button>
  </form>
  <p class="text-center mt-3 mb-0">
    Don’t have an account? <a href="/auth/register" class="text-decoration-none">Sign up</a>
  </p>
</div>
</div>
{% endblock %}
